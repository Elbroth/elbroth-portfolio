<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06060b"/>
      <stop offset="100%" style="stop-color:#0c0c14"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#7c6bf0;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#7c6bf0;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#7c6bf0"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00d4aa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <ellipse cx="900" cy="100" rx="350" ry="350" fill="url(#glow1)"/>
  <ellipse cx="200" cy="500" rx="300" ry="300" fill="url(#glow2)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent-line)"/>

  <!-- Logo bracket -->
  <text x="600" y="240" text-anchor="middle" font-family="monospace" font-weight="700" font-size="28" fill="#00d4aa" opacity="0.6">{ E }</text>

  <!-- Main name -->
  <text x="600" y="330" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="96" fill="url(#text-grad)" letter-spacing="-4">Elbroth</text>

  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="22" fill="#8888a0" letter-spacing="4">Web3 · AI · Builder</text>

  <!-- Bottom accent line -->
  <line x1="450" y1="430" x2="750" y2="430" stroke="url(#accent-line)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="16" fill="#4e4e66">Community Operations · AI & Automation · Software</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="400" font-size="14" fill="#00d4aa" opacity="0.5">elbroth.dev</text>
</svg>